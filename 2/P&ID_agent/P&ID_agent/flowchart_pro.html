<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&ID Flowchart</title>
<style>
  :root {
    --bg: #fafafa;
    --fg: #212121;
    --panel: #ffffff;
    --border: #e0e0e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #e0e0e0;
      --panel: #1e1e1e;
      --border: #333333;
    }
  }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  .header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 500;
  }
  .container {
    padding: 16px;
    overflow: auto;
  }
  .svg-wrapper {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    display: inline-block;
  }
  .svg-wrapper svg {
    max-width: 100%;
    height: auto;
  }
  .legend {
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    margin-right: 20px;
    margin-bottom: 8px;
  }
  .legend-swatch {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    margin-right: 6px;
    border: 1.5px solid;
  }
  .node:hover circle, .node:hover rect, .node:hover polygon {
    filter: brightness(0.95);
    cursor: pointer;
  }
</style>
</head>
