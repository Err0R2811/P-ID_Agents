[project]
name = "pid-agent-4"
version = "0.1.0"
description = "P&ID PDF processing agent that splits, extracts, and calls LLMs for Markdown and JSON outputs"
readme = "README.md"
authors = [
    { name = "Aryan Patel", email = "aryan.p@tecwick.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
]

[project.scripts]
pid-agent-4 = "pid_agent_4:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
